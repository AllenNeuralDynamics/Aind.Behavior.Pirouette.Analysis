[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------
[project]
name = "aind-behavior-pirouette-analysis"
version = "0.1.0"
description = "Processing and analysis toolkit for chronic ephys and behavior (Pirouette) data, including pose tracking, video, and AWS S3 open datasets"
readme = "README.md"
license = "MIT"

authors = [
    { name = "Brandon Pratt", email = "brandon.pratt@alleninstitute.org" }
]

requires-python = ">=3.11"

keywords = [
    "data",
    "analysis",
    "visualization",
    "video",
    "pose",
    "deeplabcut",
    "ephys",
    "behavior",
    "pirouette",
    "aind",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# ---------------------------------------------------------------------
# Core dependencies
# ---------------------------------------------------------------------
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pydantic>=2.0",
    "tqdm>=4.66",
    "python-dotenv>=0.21",
    # --- Aeon API: Harp-time <-> datetime conversion, camera/video readers ---
    "swc-aeon>=0.2.0",
    # --- .csv is handled by pandas (above) ---
    # --- .h5 support ---
    "h5py>=3.9",            # generic HDF5 read/write
    "tables>=3.9",          # PyTables backend for pandas.read_hdf (DeepLabCut pose files)
    # --- .parquet support (default dataset output format) ---
    "pyarrow>=14.0",
    # --- .mp4 / video support ---
    "opencv-python>=4.8",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    # --- AWS S3 open-data access (e.g. s3://aind-open-data) ---
    "boto3>=1.34",
    "botocore>=1.34",
    "s3fs>=2024.2",
]

# ---------------------------------------------------------------------
# Optional dependencies
# ---------------------------------------------------------------------
[project.optional-dependencies]

video = [
    "scikit-image>=0.22",
]

gui = [
    "dash>=2.16",
    "plotly>=5.18",
    "pyngrok>=7.0",
]

notebook = [
    "jupyterlab>=4.0",
    "notebook>=7.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

dev = [
    "pytest>=7.4",
    "pytest-cov",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.5",
]

docs = [
    # Core framework
    "mkdocs>=1.6",
    # Material theme
    "mkdocs-material>=9.0",
    # API docs from docstrings (installs mkdocstrings-python automatically)
    "mkdocstrings[python]>=1.0",
    # Markdown extensions used in mkdocs.yml (pymdownx.*)
    "pymdown-extensions>=10.0",
    # Syntax highlighting for code blocks
    "pygments>=2.16",
    # GitHub Pages deployment (mkdocs gh-deploy)
    "ghp-import>=2.1",
]

all = [
    "aind-behavior-pirouette-analysis[video,gui,notebook,dev,docs]",
]

# ---------------------------------------------------------------------
# setuptools configuration (SRC layout)
# ---------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]
include = ["pirouette_data*"]

# ---------------------------------------------------------------------
# uv dependency groups
# ---------------------------------------------------------------------
[dependency-groups]

dev = [
    "pytest>=7.4",
    "pytest-cov",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.5",
]

notebook = [
    "jupyterlab>=4.0",
    "notebook>=7.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

docs = [
    # Core framework
    "mkdocs>=1.6",
    # Material theme
    "mkdocs-material>=9.0",
    # API docs from docstrings (installs mkdocstrings-python automatically)
    "mkdocstrings[python]>=1.0",
    # Markdown extensions used in mkdocs.yml (pymdownx.*)
    "pymdown-extensions>=10.0",
    # Syntax highlighting for code blocks
    "pygments>=2.16",
    # GitHub Pages deployment (mkdocs gh-deploy)
    "ghp-import>=2.1",
]

video = [
    "scikit-image>=0.22",
]

gui = [
    "dash>=2.16",
    "plotly>=5.18",
    "pyngrok>=7.0",
]

# ---------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

# ---------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
  build
| dist
| \.venv
| sandbox
)/
'''

# ---------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]
exclude = ["sandbox"]

# ---------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["sandbox"]
